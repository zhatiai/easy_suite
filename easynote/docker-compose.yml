services:
  easynote:
    build: .
    image: easynote:local
    container_name: easynote
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PORT: "8791"
      HEALTH_PORT: "8792"
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env (see .env.docker.example)}
      PUBLIC_ORIGIN_ALIASES: ${PUBLIC_ORIGIN_ALIASES:-}
      ALLOW_LOCAL_HTTP: ${ALLOW_LOCAL_HTTP:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${EASYNOTE_PORT:-8791}:8791"
    volumes:
      - ${EASYNOTE_DATA_DIR:-/var/lib/easynote/data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
